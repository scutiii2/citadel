[project]
name = "legion"
description = "Standalone MCP agent: one pinned LLM provider+model, talking to mcp_server as an MCP client while exposing itself as an MCP server to chat_app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyJWT>=2.10",
    "cryptography>=44",
    "mcp>=1.28.0,<2.0.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
legion = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: real processes or servers; skipped by default, run with -m \"\""]
addopts = "-m 'not slow'"
