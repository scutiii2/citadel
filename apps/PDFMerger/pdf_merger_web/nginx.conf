# Serves the built UI and sends /api to pdf_merger, so the browser sees one
# origin (the session cookie works, no CORS). SSE streams unbuffered.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 128m;

    location /api/ {
        proxy_pass http://pdf_merger:8040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
