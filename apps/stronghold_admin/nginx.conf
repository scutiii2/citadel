# Template: nginx fills ${FRAME_ANCESTORS} from the environment at start (default 'none': nobody may frame this page).
# Serves the built stronghold_admin and sends /api to portcullis, so the browser
# sees one origin (the session cookie just works, no CORS). X-Forwarded-For
# is set to the real peer, not appended, so a client cannot forge it;
# portcullis trusts it only from the compose network.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors ${FRAME_ANCESTORS}" always;
    add_header X-Content-Type-Options nosniff always;

    # Docker DNS, re-resolved every 10 s: a recreated portcullis gets a new IP, and a fixed name in proxy_pass would stay on the old one (502).
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $portcullis http://portcullis:29601;
        proxy_pass $portcullis;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;          # streamed chat replies
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
