[project]
name = "citadel-image-ocr"
version = "0.1.0"
description = "Local image-region OCR CLI and async Python API"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "pytesseract>=0.3.13,<0.4"]

[project.scripts]
image-ocr = "image_ocr:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["image_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
