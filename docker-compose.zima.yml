# ZimaOS overlay for docker-compose.yml. Opens the admin web UIs to the LAN.
# Needs Docker Compose 2.24+ (for !override).
# The stack gateways publish nothing; add docker-compose.gateway-admin.yml as a third -f file to open their admin pages on 127.0.0.1 while setting up.
# Start:  docker compose -f docker-compose.yml -f docker-compose.zima.yml up -d --build

services:
  armory:
    # Dedicated Obsidian vault, read-only, for the obsidian capability's semantic index.
    volumes:
      - /DATA/AppData/obsidian/config/Desktop/Obsidian-vaults/citadel-brain:/vault:ro
  portcullis:
    # The Ember desktop app and the terminal chat connect here: http://<zima-ip>:29601
    ports:
      - "29601:29601"
  portcullis_admin:
    ports: !override
      - "26501:80"
  legion_admin:
    ports: !override
      - "26500:80"
  armory_admin:
    ports: !override
      - "26503:80"
  stronghold_admin:
    ports: !override
      - "26504:80"
  treasury_admin:
    ports: !override
      - "26505:80"
