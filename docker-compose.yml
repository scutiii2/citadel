# Stack: portcullis_admin / legion_admin / armory_admin / stronghold_admin / treasury_admin -> portcullis -> armory / legion / treasury / stronghold; legion -> LayaModel (its own stack, reached through the host's published port 29220, not started here).
# Start:  docker compose up -d --build
# Per-service Ed25519 identities are created on first start. Public trust is shared read-only
# with peers; private identities remain in their own volumes. Per-app secrets load when present.
# Runtime data and cache are folders in this repo: ${CITADEL_DATA_DIR:-./.data}/<service> and
# ${CITADEL_CACHE_DIR:-./.cache}/<service> (set both in the root .env to move them).
# The root .env is mounted read-only in each service; see citadel_auth/rootenv.py for what it overrides.
# Container-only configs live in docker/configs and are mounted over each
# app's configs/ file; the apps' own configs stay untouched.

name: citadel

services:
  armory:
    build: ./apps/armory
    restart: unless-stopped
    env_file:
      - path: ./apps/armory/.env
        required: false
    environment:
      TREASURY_URL: http://treasury:29602
      CITADEL_ADVERTISE_URL: http://armory:29600
      MCP_HOST: 0.0.0.0
      CITADEL_SERVICE: armory
      CITADEL_ROOT_ENV: /citadel.env
      CITADEL_TRUST_DIR: /trust
      CITADEL_IDENTITY_DIR: /identity
      MCP_PORT: "29600"
      # The notes tools read the notes the Notes page saves, which Stronghold keeps in its own database.
      DB_GATEWAY_INSTANCE: armory
      DB_GATEWAY_CONNECTION: stronghold
    volumes:
      - ${CITADEL_DATA_DIR:-./.data}/armory:/app/.data
      - ${CITADEL_CACHE_DIR:-./.cache}/armory:/app/.cache
      - identity_armory:/identity:rw
      - ./.env:/citadel.env:ro
      - trust_armory:/trust/armory:rw
      - trust_legion:/trust/legion:ro
      - trust_treasury:/trust/treasury:ro
      - trust_stronghold:/trust/stronghold:ro
      - trust_portcullis:/trust/portcullis:ro
      # server_manager (Docker apps list/start/stop/logs) talks to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [treasury]
    networks: [core]

  # ConversationGateway (29407) and DecisionGateway (29406) are not part of this file. Each runs from its own repo
  # (AI/ModelProviders/<name>, `docker compose up -d --build` there) and joins citadel_core, so Legion still reaches
  # them as http://conversationgateway:29407 and http://decisiongateway:29406. Start this stack first: it creates the network.

  legion:
    build: ./apps/legion
    restart: unless-stopped
    env_file:
      - path: ./apps/legion/.env
        required: false
    environment:
      TREASURY_URL: http://treasury:29602
      CITADEL_ADVERTISE_URL: http://legion:29603
      AI_AGENT_HOST: 0.0.0.0
      CITADEL_SERVICE: legion
      CITADEL_ROOT_ENV: /citadel.env
      CITADEL_TRUST_DIR: /trust
      CITADEL_IDENTITY_DIR: /identity
      AI_AGENT_ADVERTISE_URL: http://legion
      # Legion keeps each gateway's address and token, set by an admin, in Treasury.
    # Lets legion reach host-published stacks as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - identity_legion:/identity:rw
      - ./.env:/citadel.env:ro
      - trust_armory:/trust/armory:ro
      - trust_legion:/trust/legion:rw
      - trust_treasury:/trust/treasury:ro
      - trust_stronghold:/trust/stronghold:ro
      - trust_portcullis:/trust/portcullis:ro
      - ${CITADEL_DATA_DIR:-./.data}/legion:/app/.data
    depends_on: [armory, treasury]
    networks: [core]

  treasury:
    build: ./apps/treasury
    restart: unless-stopped
    env_file:
      - path: ./apps/treasury/.env
        required: false
    environment:
      DB_GATEWAY_PORT: "29602"
      CITADEL_SERVICE: treasury
      CITADEL_ROOT_ENV: /citadel.env
      CITADEL_TRUST_DIR: /trust
      CITADEL_IDENTITY_DIR: /identity
    volumes:
      - ./docker/configs/treasury/app.json:/app/configs/config_app.json:ro
      - ${CITADEL_DATA_DIR:-./.data}/treasury:/app/.data
      - identity_treasury:/identity:rw
      - ./.env:/citadel.env:ro
      - trust_armory:/trust/armory:ro
      - trust_legion:/trust/legion:ro
      - trust_treasury:/trust/treasury:rw
      - trust_stronghold:/trust/stronghold:ro
      - trust_portcullis:/trust/portcullis:ro
    networks: [core]

  # Product logic. Only portcullis calls it, so no port is published.
  # Run ONE replica: running chat turns live in this process's memory (Plan 10), so a second replica could not see them.
  stronghold:
    build: ./apps/stronghold
    restart: unless-stopped
    # On stop, running turns are cancelled and their partial text saved; give that time before SIGKILL.
    stop_grace_period: 30s
    env_file:
      - path: ./apps/stronghold/.env
        required: false
    environment:
      TREASURY_URL: http://treasury:29602
      CITADEL_ADVERTISE_URL: http://stronghold:29650
      STRONGHOLD_HOST: 0.0.0.0
      CITADEL_SERVICE: stronghold
      CITADEL_ROOT_ENV: /citadel.env
      CITADEL_TRUST_DIR: /trust
      CITADEL_IDENTITY_DIR: /identity
      STRONGHOLD_PORT: "29650"
      AGENTS_REGISTRY_PATH: /agent_data/agent_registry.json
      STRONGHOLD_DATA_DIR: /data
    volumes:
      - ./docker/configs/stronghold/app.json:/app/configs/config_app.json:ro
      # keys.json: the key that encrypts saved secrets (brain keys, private-extension headers).
      - ${CITADEL_DATA_DIR:-./.data}/stronghold:/data
      - identity_stronghold:/identity:rw
      - ./.env:/citadel.env:ro
      - trust_armory:/trust/armory:ro
      - trust_legion:/trust/legion:ro
      - trust_treasury:/trust/treasury:ro
      - trust_stronghold:/trust/stronghold:rw
      - trust_portcullis:/trust/portcullis:ro
      # Legion's registry of running agents (notes ask the Laya and tag-writer agents).
      - ${CITADEL_DATA_DIR:-./.data}/legion:/agent_data:ro
    depends_on: [treasury, armory]
    networks: [core]

  portcullis:
    build: ./apps/portcullis
    restart: unless-stopped
    env_file:
      - path: ./apps/portcullis/.env
        required: false
    environment:
      TREASURY_URL: http://treasury:29602
      CITADEL_ADVERTISE_URL: http://portcullis:29601
      EMBER_API_HOST: 0.0.0.0
      CITADEL_SERVICE: portcullis
      CITADEL_ROOT_ENV: /citadel.env
      CITADEL_TRUST_DIR: /trust
      CITADEL_IDENTITY_DIR: /identity
    volumes:
      - ./docker/configs/portcullis/app.json:/app/configs/config_app.json:ro
      # portcullis reads and writes its secrets (EMBER_SECRETS_KEY) in its own .env file.
      - ./apps/portcullis/.env:/app/.env
      - ${CITADEL_DATA_DIR:-./.data}/portcullis:/app/.data
      - identity_portcullis:/identity:rw
      - ./.env:/citadel.env:ro
      - trust_armory:/trust/armory:ro
      - trust_legion:/trust/legion:ro
      - trust_treasury:/trust/treasury:ro
      - trust_stronghold:/trust/stronghold:ro
      - trust_portcullis:/trust/portcullis:rw
      - ${CITADEL_DATA_DIR:-./.data}/legion:/agent_data:ro
    depends_on: [armory, legion, treasury, stronghold]
    networks: [core]

  portcullis_admin:
    build:
      context: ./apps
      dockerfile: portcullis_admin/Dockerfile
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: "${HUB_FRAME_ANCESTORS:-'none'}"
    ports:
      - "127.0.0.1:26501:80"
    depends_on: [portcullis]
    networks: [core]

  legion_admin:
    build: ./apps/legion_admin
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: "${HUB_FRAME_ANCESTORS:-'none'}"
    ports:
      - "127.0.0.1:26500:80"
    depends_on: [portcullis]
    networks: [core]

  armory_admin:
    build: ./apps/armory_admin
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: "${HUB_FRAME_ANCESTORS:-'none'}"
    ports:
      - "127.0.0.1:26503:80"
    depends_on: [portcullis]
    networks: [core]

  stronghold_admin:
    build: ./apps/stronghold_admin
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: "${HUB_FRAME_ANCESTORS:-'none'}"
    ports:
      - "127.0.0.1:26504:80"
    depends_on: [portcullis]
    networks: [core]

  treasury_admin:
    build: ./apps/treasury_admin
    restart: unless-stopped
    environment:
      FRAME_ANCESTORS: "${HUB_FRAME_ANCESTORS:-'none'}"
    ports:
      - "127.0.0.1:26505:80"
    depends_on: [portcullis]
    networks: [core]

networks:
  core:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  trust_armory:
  trust_legion:
  trust_treasury:
  trust_stronghold:
  trust_portcullis:
  identity_armory:
  identity_legion:
  identity_treasury:
  identity_stronghold:
  identity_portcullis:
