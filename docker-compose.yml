# Stack: portcullis_admin / legion_admin / armory_admin / stronghold_admin / treasury_admin -> portcullis -> armory / legion / treasury / stronghold; legion -> LayaModel (its own stack, reached through the host's published port 29220, not started here).
# Start:  docker compose up -d --build
# The internal token is made on first start and shared through the internal_token volume. Per-app
# secrets stay in apps/<app>/.env and are loaded when the file exists.
# Container-only configs live in docker/configs and are mounted over each
# app's configs/ file; the apps' own configs stay untouched.

name: citadel

x-internal-token: &internal_token  # shared file, made by whichever app starts first
  INTERNAL_TOKEN_FILE: /run/citadel/internal_token

services:
  armory:
    build: ./apps/armory
    restart: unless-stopped
    env_file:
      - path: ./apps/armory/.env
        required: false
    environment:
      <<: *internal_token
      MCP_HOST: 0.0.0.0
      MCP_PORT: "29600"
      DB_GATEWAY_URL: http://treasury:29602
      # The notes tools read the notes the Notes page saves, which Stronghold keeps in its own database.
      DB_GATEWAY_INSTANCE: armory
      DB_GATEWAY_CONNECTION: stronghold
      STRONGHOLD_URL: http://stronghold:29650
    volumes:
      # Writable: the Extensions page in armory_admin saves added extensions into this tracked file.
      - ./docker/configs/armory/extensions.json:/app/configs/config_extensions.json
      # Writable: the Capabilities page in armory_admin saves its on/off toggles into this tracked file.
      - ./docker/configs/armory/capabilities.json:/app/configs/config_capabilities.json
      - armory_data:/app/.data
      - internal_token:/run/citadel
      # server_manager (Docker apps list/start/stop/logs) talks to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [treasury]
    networks: [core]

  # Shared chat-model gateway (its own repo). Part of this stack, but open to callers
  # outside Citadel: each one gets its own token on http://<host>:29407/admin/.
  conversationgateway:
    build: ${CONVERSATION_GATEWAY_DIR:-../../AI/ModelProviders/ConversationGateway}
    restart: unless-stopped
    environment:
      SERVICE_ADMIN_PASSWORD: ${CONVERSATION_GATEWAY_ADMIN_PASSWORD:?set CONVERSATION_GATEWAY_ADMIN_PASSWORD in the root .env}
    ports:
      - "0.0.0.0:29407:29407"
    volumes:
      - conversationgateway_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29407/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [core]

  # Shared decision-model gateway (its own repo): TypeSafe Jev and the Laya model service.
  # Part of this stack, but open to callers outside Citadel by token, like conversationgateway.
  decisiongateway:
    build: ${DECISION_GATEWAY_DIR:-../../AI/ModelProviders/DecisionGateway}
    restart: unless-stopped
    environment:
      SERVICE_ADMIN_PASSWORD: ${DECISION_GATEWAY_ADMIN_PASSWORD:?set DECISION_GATEWAY_ADMIN_PASSWORD in the root .env}
    ports:
      - "0.0.0.0:29406:29406"
    volumes:
      - decisiongateway_data:/data
    # Lets a saved gateway reach a host-published model service (LayaModel) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29406/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    networks: [core]

  legion:
    build: ./apps/legion
    restart: unless-stopped
    env_file:
      - path: ./apps/legion/.env
        required: false
    environment:
      <<: *internal_token
      AI_AGENT_HOST: 0.0.0.0
      AI_AGENT_ADVERTISE_URL: http://legion
      MCP_SERVER_URL: http://armory:29600/mcp
      CONVERSATION_GATEWAY_URL: http://conversationgateway:29407
      DECISION_GATEWAY_URL: http://decisiongateway:29406
      # Legion keeps each gateway's address and token, set by an admin, in Treasury.
      DB_GATEWAY_URL: http://treasury:29602
    # Lets legion reach host-published stacks as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/configs/legion/servers.json:/app/configs/config_servers.json:ro
      - agent_data:/app/.data
      - internal_token:/run/citadel
    depends_on: [armory, conversationgateway, decisiongateway, treasury]
    networks: [core]

  treasury:
    build: ./apps/treasury
    restart: unless-stopped
    env_file:
      - path: ./apps/treasury/.env
        required: false
    environment:
      <<: *internal_token
      DB_GATEWAY_PORT: "29602"
    volumes:
      - ./docker/configs/treasury/app.json:/app/configs/config_app.json:ro
      - ./docker/configs/treasury/connections.json:/app/configs/config_connections.json:ro
      - treasury_data:/app/data
      - internal_token:/run/citadel
    networks: [core]

  # Product logic. Only portcullis calls it, so no port is published.
  # Run ONE replica: running chat turns live in this process's memory (Plan 10), so a second replica could not see them.
  stronghold:
    build: ./apps/stronghold
    restart: unless-stopped
    # On stop, running turns are cancelled and their partial text saved; give that time before SIGKILL.
    stop_grace_period: 30s
    env_file:
      - path: ./apps/stronghold/.env
        required: false
    environment:
      <<: *internal_token
      STRONGHOLD_HOST: 0.0.0.0
      STRONGHOLD_PORT: "29650"
      DB_GATEWAY_URL: http://treasury:29602
      # Account facts, admin switches, email and the error log are asked from Portcullis.
      PORTCULLIS_URL: http://portcullis:29601
      ARMORY_URL: http://armory:29600
      # Attached files and speech go to these tool services; their tokens are BARD_TOKEN, SCRIBE_TOKEN and READER_TOKEN in apps/stronghold/.env.
      BARD_URL: http://bard:29400
      SCRIBE_URL: http://scribe:29401
      READER_URL: http://reader:29402
      AGENTS_REGISTRY_PATH: /agent_data/agent_registry.json
      STRONGHOLD_DATA_DIR: /data
    volumes:
      - ./docker/configs/stronghold/app.json:/app/configs/config_app.json:ro
      # keys.json: the key that encrypts saved secrets (brain keys, private-extension headers).
      - stronghold_data:/data
      # Legion's registry of running agents (notes ask the Laya and tag-writer agents).
      - agent_data:/agent_data:ro
      - internal_token:/run/citadel
    depends_on: [treasury, armory]
    networks: [core]

  portcullis:
    build: ./apps/portcullis
    restart: unless-stopped
    env_file:
      - path: ./apps/portcullis/.env
        required: false
    environment:
      <<: *internal_token
      EMBER_API_HOST: 0.0.0.0
    volumes:
      - ./docker/configs/portcullis/app.json:/app/configs/config_app.json:ro
      # portcullis reads and writes its secrets (EMBER_SECRETS_KEY) in its own .env file.
      - ./apps/portcullis/.env:/app/.env
      - portcullis_data:/app/data
      - internal_token:/run/citadel
      - agent_data:/agent_data:ro
    depends_on: [armory, legion, treasury, stronghold]
    networks: [core]

  portcullis_admin:
    build:
      context: ./apps
      dockerfile: portcullis_admin/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:26501:80"
    depends_on: [portcullis]
    networks: [core]

  legion_admin:
    build: ./apps/legion_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:26500:80"
    depends_on: [portcullis]
    networks: [core]

  armory_admin:
    build: ./apps/armory_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:26503:80"
    depends_on: [portcullis]
    networks: [core]

  stronghold_admin:
    build: ./apps/stronghold_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:26504:80"
    depends_on: [portcullis]
    networks: [core]

  treasury_admin:
    build: ./apps/treasury_admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:26505:80"
    depends_on: [portcullis]
    networks: [core]

networks:
  core:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  armory_data:
  agent_data:
  treasury_data:
  portcullis_data:
  stronghold_data:
  conversationgateway_data:
  decisiongateway_data:
  internal_token:
