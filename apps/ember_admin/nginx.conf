# Serves the built ember_web and sends /api to ember_api, so the browser
# sees one origin (the session cookie just works, no CORS). X-Forwarded-For
# is set to the real peer, not appended, so a client cannot forge it;
# ember_api trusts it only from the compose network.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    location /api/ {
        proxy_pass http://ember_api:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;          # streamed chat replies
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
